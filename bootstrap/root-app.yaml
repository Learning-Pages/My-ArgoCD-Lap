apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: shopsphere-apps
  namespace: argocd
spec:
  description: "Production project for ShopSphere microservices"
  sourceRepos:
    - 'https://github.com/Learning-Pages/My-ArgoCD-Lap.git'
  destinations:
    - namespace: 'shopsphere-*'
      server: 'https://kubernetes.default.svc'
    - namespace: default
      server: 'https://kubernetes.default.svc'
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Learning-Pages/My-ArgoCD-Lap.git
    targetRevision: main
    path: bootstrap
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: matrix-shopsphere-apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - list:
              elements:
                - env: dev
                  cluster: https://kubernetes.default.svc
                  autoSync: "true"
                - env: staging
                  cluster: https://kubernetes.default.svc
                  autoSync: "true"
                - env: prod
                  cluster: https://kubernetes.default.svc
                  autoSync: "false"
          - list:
              elements:
                - app: cart
                - app: checkout
                - app: frontend
  template:
    metadata:
      name: '{{.env}}-{{.app}}-service'
      labels:
        app.kubernetes.io/name: '{{.app}}'
        app.kubernetes.io/part-of: shopsphere
        environment: '{{.env}}'
    spec:
      project: shopsphere-apps
      source:
        repoURL: https://github.com/Learning-Pages/My-ArgoCD-Lap.git
        targetRevision: main
        # ⚠️ REPLACE with the real directory in your repo for each app/env.
        # Must be a DIRECTORY, never a single file.
        path: bootsrap
      destination:
        server: '{{.cluster}}'
        namespace: 'shopsphere-{{.env}}'
      syncPolicy:
        {{- if eq .autoSync "true" }}
        automated:
          prune: true
          selfHeal: true
        {{- end }}
        syncOptions:
          - CreateNamespace=true
