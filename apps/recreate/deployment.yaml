apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopsphere-recreate
  namespace: default
  labels:
    app: shopsphere-recreate
spec:
  replicas: 4
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: shopsphere-recreate
  template:
    metadata:
      labels:
        app: shopsphere-recreate
    spec:
      containers:
        - name: web
          image: nginx:1.27
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: shopsphere-recreate
  namespace: default
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: shopsphere-recreate
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: recreate
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ${GIT_REPO}
    targetRevision: ${GIT_BRANCH}
    path: apps/recreate
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
