apiVersion: v1
kind: Service
metadata:
  name: shopsphere-rolling
  namespace: default
  labels:
    app: shopsphere-rolling
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: shopsphere-rolling
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rolling-update
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: ${GIT_REPO}
    targetRevision: ${GIT_BRANCH}
    path: apps/rolling-update
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
