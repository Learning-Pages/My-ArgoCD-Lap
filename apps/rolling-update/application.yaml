apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shopsphere-manual
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Learning-Pages/My-ArgoCD-Lap.git
    targetRevision: main
    path: apps/rolling-update
  destination:
    server: https://kubernetes.default.svc
    namespace: shopsphere-prod
  # MANUAL SYNC: Notice automated.prune and automated.selfHeal are NOT configured.
  # Synchronization will only execute when manually triggered by an engineer.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
