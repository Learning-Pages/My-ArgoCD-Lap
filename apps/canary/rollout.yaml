apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: shopsphere-canary
  namespace: default
spec:
  replicas: 4
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: shopsphere-canary
  template:
    metadata:
      labels:
        app: shopsphere-canary
    spec:
      containers:
        - name: web
          image: nginx:1.27
          ports:
            - containerPort: 80
  strategy:
    canary:
      canaryService: shopsphere-canary-preview
      stableService: shopsphere-canary-stable
      steps:
        - setWeight: 25
        - pause: { duration: 1m }
        - setWeight: 50
        - pause: { duration: 2m }
        - setWeight: 100
---
apiVersion: v1
kind: Service
metadata:
  name: shopsphere-canary-stable
  namespace: default
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: shopsphere-canary
---
apiVersion: v1
kind: Service
metadata:
  name: shopsphere-canary-preview
  namespace: default
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: shopsphere-canary
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: canary
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ${GIT_REPO}
    targetRevision: ${GIT_BRANCH}
    path: apps/canary
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
