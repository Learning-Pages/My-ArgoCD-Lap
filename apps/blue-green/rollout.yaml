apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: shopsphere-bg
  namespace: default
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: shopsphere-bg
  template:
    metadata:
      labels:
        app: shopsphere-bg
    spec:
      containers:
        - name: web
          image: nginx:1.27
          ports:
            - containerPort: 80
  strategy:
    blueGreen:
      activeService: shopsphere-bg-active
      previewService: shopsphere-bg-preview
      autoPromotionEnabled: false
      scaleDownDelaySeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: shopsphere-bg-active
  namespace: default
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: shopsphere-bg
---
apiVersion: v1
kind: Service
metadata:
  name: shopsphere-bg-preview
  namespace: default
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: shopsphere-bg
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: blue-green
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Learning-Pages/My-ArgoCD-Lap.git
    targetRevision: main
    path: apps/blue-green
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
