apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: manual-sync-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: <YOUR_GIT_REPO>
    targetRevision: ${GIT_BRANCH}
    path: apps/rolling-update
  destination:
    server: https://kubernetes.default.svc
    namespace: manual-demo
  # Note: syncPolicy is omitted intentionally for manual synchronization demo
